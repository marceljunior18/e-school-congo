<!DOCTYPE html>
<html lang="fr" class="scroll-smooth">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>E-School — Plateforme Éducative d'Excellence</title>
  
  <!-- SEO & Métadonnées -->
  <meta name="description" content="E-School : plateforme SaaS éducative d'excellence au Congo et en Afrique Centrale. +5 000 exercices interactifs, simulations du Bac, tutorat IA et tableau de bord en direct." />
  <meta name="author" content="E-School Technologies" />

  <!-- Google Fonts: Plus Jakarta Sans & Inter -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800;900&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

  <!-- Tailwind CSS via CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['"Plus Jakarta Sans"', 'Inter', 'system-ui', 'sans-serif'],
          },
          colors: {
            brand: {
              50: '#F0F5FF',
              100: '#E0EBFF',
              500: '#2F6FED',
              600: '#255ED4',
              700: '#1E4FD1',
            },
            dark: '#1A1D29',
            surface: '#F7F8FA',
            success: {
              DEFAULT: '#22C55E',
              light: '#E8F8EE',
            },
            accent: {
              DEFAULT: '#F5A623',
              light: '#FEF6E7',
            }
          }
        }
      }
    }
  </script>

  <!-- React 18 & Babel Standalone -->
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <!-- Styles personnalisés pour micro-animations et survol -->
  <style>
    body {
      background-color: #F7F8FA;
      color: #1A1D29;
      font-family: 'Plus Jakarta Sans', 'Inter', sans-serif;
    }

    /* Animation au survol des boutons */
    .btn-hover {
      transition: all 0.2s ease-in-out !important;
    }
    .btn-hover:hover {
      transform: translateY(-2px) scale(1.02);
      box-shadow: 0 10px 24px -8px rgba(47, 111, 237, 0.28);
    }
    .btn-hover:active {
      transform: translateY(0) scale(0.99);
    }

    /* Animation au survol des cartes */
    .card-hover {
      transition: all 0.25s cubic-bezier(0.16, 1, 0.3, 1);
    }
    .card-hover:hover {
      transform: translateY(-3px);
      box-shadow: 0 14px 30px -10px rgba(15, 23, 42, 0.09);
    }

    /* Animation d'apparition douce */
    @keyframes fadeInUp {
      from {
        opacity: 0;
        transform: translateY(12px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .animate-fadeInUp {
      animation: fadeInUp 0.45s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }

    /* Custom scrollbar discrète */
    ::-webkit-scrollbar {
      width: 6px;
      height: 6px;
    }
    ::-webkit-scrollbar-track {
      background: #F1F5F9;
    }
    ::-webkit-scrollbar-thumb {
      background: #CBD5E1;
      border-radius: 9999px;
    }
    ::-webkit-scrollbar-thumb:hover {
      background: #94A3B8;
    }
  </style>
</head>
<body class="bg-[#F7F8FA] min-h-screen text-[#1A1D29]">
  
  <div id="root"></div>

  <!-- Script React + Babel entièrement autonome -->
  <script type="text/babel">
    const { useState } = React;

    // 1. COMPOSANT HEADER AVEC MARCEL JUNIOR (IMAGE 2) & AUTO-LAYOUT
    function Header({ activeTab, setActiveTab, onNavigate, auth, onLogout }) {
      const [mobileMenuOpen, setMobileMenuOpen] = useState(false);

      const navLinks = [
        { id: 'hero', label: 'Accueil', target: null },
        { id: 'dashboard', label: 'Tableau de bord', target: 'dashboard-section' },
        { id: 'features', label: 'Fonctionnalités', target: 'features-section' },
        { id: 'pricing', label: 'Tarifs (FCFA)', target: 'pricing-section' },
        { id: 'testimonials', label: 'Réussites', target: 'testimonials-section' },
        { id: 'faq', label: 'FAQ', target: 'faq-section' }
      ];

      const handleNavClick = (item) => {
        setActiveTab(item.id);
        setMobileMenuOpen(false);
        if (item.target) {
          const el = document.getElementById(item.target);
          if (el) el.scrollIntoView({ behavior: 'smooth' });
        } else {
          window.scrollTo({ top: 0, behavior: 'smooth' });
        }
      };

      return (
        <header className="sticky top-0 z-50 bg-white/95 backdrop-blur-md border-b border-slate-100 transition-all duration-200 shadow-xs">
          <div className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div className="flex items-center justify-between h-20">
              
              {/* Logo E-School */}
              <div
                onClick={() => {
                  if (onNavigate) onNavigate('landing');
                  handleNavClick(navLinks[0]);
                }}
                className="flex items-center gap-3 cursor-pointer group"
              >
                <div className="w-11 h-11 rounded-2xl bg-gradient-to-br from-[#2F6FED] to-[#1E4FD1] flex items-center justify-center shadow-lg shadow-blue-500/25 group-hover:scale-105 transition-transform duration-200">
                  <svg className="w-6 h-6 text-white" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.3" strokeLinecap="round" strokeLinejoin="round">
                    <path d="M22 10v6M2 10l10-5 10 5-10 5z" />
                    <path d="M6 12v5c3 3 9 3 12 0v-5" />
                  </svg>
                </div>
                <div>
                  <div className="flex items-center gap-1.5">
                    <span className="text-2xl font-black tracking-tight text-[#1A1D29]">E-School</span>
                    <span className="text-[10px] uppercase font-bold tracking-wider px-1.5 py-0.5 rounded-full bg-[#E8F8EE] text-[#22C55E]">SaaS</span>
                  </div>
                  <p className="text-[11px] font-medium text-slate-400 hidden sm:block">Plateforme d'Excellence Éducative</p>
                </div>
              </div>

              {/* Navigation Principale */}
              <nav className="hidden lg:flex items-center bg-slate-50/90 p-1.5 rounded-2xl border border-slate-200/60 shadow-inner">
                {navLinks.map((item) => {
                  const isActive = activeTab === item.id;
                  return (
                    <button
                      key={item.id}
                      onClick={() => handleNavClick(item)}
                      className={`relative px-3.5 py-2 rounded-xl text-xs sm:text-sm font-semibold transition-all duration-200 ${
                        isActive
                          ? 'bg-white text-[#2F6FED] shadow-sm shadow-slate-200/80 font-bold'
                          : 'text-slate-500 hover:text-[#1A1D29] hover:bg-slate-100/60'
                      }`}
                    >
                      {item.label}
                      {isActive && (
                        <span className="absolute bottom-1 left-1/2 -translate-x-1/2 w-1.5 h-1.5 rounded-full bg-[#2F6FED]"></span>
                      )}
                    </button>
                  );
                })}
              </nav>

              {/* Profil & Actions Droite (Auto-Layout Moderne) */}
              <div className="flex items-center gap-3 sm:gap-4">
                
                {/* Badge Abonnement en FCFA */}
                <div className="hidden xl:flex items-center gap-2 px-3 py-1.5 rounded-xl bg-gradient-to-r from-blue-50 to-indigo-50 border border-blue-100">
                  <span className="w-2 h-2 rounded-full bg-[#22C55E] animate-pulse"></span>
                  <span className="text-xs font-semibold text-slate-600">Formule Pro :</span>
                  <span className="text-xs font-bold text-[#1E4FD1]">15 000 FCFA<span className="font-normal text-slate-500">/mois</span></span>
                </div>

                {/* Bouton Notifications */}
                <button
                  title="Notifications"
                  className="relative p-2.5 rounded-xl text-slate-500 hover:text-[#1A1D29] hover:bg-slate-100 transition-all duration-200 btn-hover hidden sm:block"
                >
                  <svg className="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" strokeWidth="2">
                    <path strokeLinecap="round" strokeLinejoin="round" d="M15 17h5l-1.405-1.405A2.032 2.032 0 0118 14.158V11a6.002 6.002 0 00-4-5.659V5a2 2 0 10-4 0v.341C7.67 6.165 6 8.388 6 11v3.159c0 .538-.214 1.055-.595 1.436L4 17h5m6 0v1a3 3 0 11-6 0v-1m6 0H9" />
                  </svg>
                  <span className="absolute top-2 right-2 w-2.5 h-2.5 bg-[#F5A623] border-2 border-white rounded-full"></span>
                </button>

                {/* Profil Utilisateur AUTO-LAYOUT avec Marcel Junior (Image 2) */}
                <div
                  onClick={() => onNavigate && onNavigate(auth && auth.isAuthenticated ? 'app-dashboard' : 'login')}
                  title={auth && auth.isAuthenticated ? "Accéder au tableau de bord" : "Se connecter"}
                  className="flex items-center gap-3 pl-2 sm:pl-3 sm:border-l sm:border-slate-200 py-1 pr-1.5 rounded-2xl hover:bg-slate-50 transition-colors cursor-pointer group"
                >
                  <div className="relative w-10 h-10 rounded-2xl overflow-hidden ring-2 ring-blue-100 shadow-sm shrink-0">
                    <img
                      src="assets/images/marcel-junior.jpg"
                      alt="Marcel Junior"
                      className="w-full h-full object-cover object-top group-hover:scale-105 transition-transform duration-200"
                    />
                    <span className={`absolute -bottom-0.5 -right-0.5 w-3 h-3 ${auth && auth.isAuthenticated ? 'bg-[#22C55E]' : 'bg-slate-300'} border-2 border-white rounded-full`}></span>
                  </div>
                  <div className="hidden sm:flex flex-col text-left justify-center">
                    <div className="text-sm font-bold text-[#1A1D29] group-hover:text-[#2F6FED] transition-colors leading-tight">
                      {auth && auth.user ? auth.user.name : 'Marcel Junior'}
                    </div>
                    <div className="text-[11px] font-semibold text-slate-400 mt-0.5">
                      {auth && auth.isAuthenticated ? 'Élève Connecté • Espace Pro' : 'Terminale C • Brazzaville 🇨🇬'}
                    </div>
                  </div>
                </div>

                {/* Bouton Connexion */}
                <button
                  onClick={() => onNavigate && onNavigate('login')}
                  className="hidden sm:inline-flex items-center px-3.5 py-2 rounded-xl text-slate-700 hover:text-[#2F6FED] hover:bg-slate-100/70 text-xs font-bold transition-all cursor-pointer btn-hover"
                >
                  Connexion
                </button>

                {/* Bouton CTA */}
                <button
                  onClick={() => {
                    if (onNavigate) {
                      onNavigate('signup');
                    } else {
                      const el = document.getElementById('pricing-section');
                      if (el) el.scrollIntoView({ behavior: 'smooth' });
                    }
                  }}
                  className="hidden sm:inline-flex items-center px-4 py-2 rounded-xl bg-gradient-to-r from-[#2F6FED] to-[#1E4FD1] text-white text-xs font-bold shadow-sm shadow-blue-500/20 btn-hover"
                >
                  Essai Gratuit
                </button>

                {/* Menu Mobile */}
                <button
                  onClick={() => setMobileMenuOpen(!mobileMenuOpen)}
                  className="lg:hidden p-2 rounded-xl text-slate-600 hover:bg-slate-100"
                >
                  <svg className="w-6 h-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M4 6h16M4 12h16M4 18h16" />
                  </svg>
                </button>

              </div>
            </div>

            {/* Menu Mobile */}
            {mobileMenuOpen && (
              <div className="lg:hidden py-3 border-t border-slate-100 animate-fadeInUp">
                <div className="flex flex-col gap-1">
                  {navLinks.map((item) => (
                    <button
                      key={item.id}
                      onClick={() => handleNavClick(item)}
                      className={`px-4 py-2.5 rounded-xl text-left text-sm font-semibold transition-colors ${
                        activeTab === item.id
                          ? 'bg-blue-50 text-[#2F6FED] font-bold'
                          : 'text-slate-600 hover:bg-slate-50'
                      }`}
                    >
                      {item.label}
                    </button>
                  ))}
                  
                  {/* Carte Profil Mobile Auto-Layout */}
                  <div
                    onClick={() => {
                      setMobileMenuOpen(false);
                      onNavigate && onNavigate(auth && auth.isAuthenticated ? 'app-dashboard' : 'login');
                    }}
                    className="mt-2 pt-2 border-t border-slate-100 flex items-center justify-between px-3 py-2 bg-slate-50 rounded-xl cursor-pointer"
                  >
                    <div className="flex items-center gap-2.5">
                      <img
                        src="assets/images/marcel-junior.jpg"
                        alt="Marcel Junior"
                        className="w-9 h-9 rounded-xl object-cover object-top ring-1 ring-blue-200"
                      />
                      <div>
                        <div className="text-xs font-bold text-[#1A1D29]">
                          {auth && auth.user ? auth.user.name : 'Marcel Junior'}
                        </div>
                        <div className="text-[10px] text-slate-500">
                          {auth && auth.isAuthenticated ? 'Élève Connecté' : 'Terminale C • Brazzaville 🇨🇬'}
                        </div>
                      </div>
                    </div>
                    <span className="text-xs font-bold text-[#1E4FD1]">15 000 FCFA/mois</span>
                  </div>

                  {/* Actions Connexion / Inscription Mobile */}
                  <div className="mt-2 pt-2 border-t border-slate-100 flex flex-col gap-2">
                    <button
                      onClick={() => { setMobileMenuOpen(false); onNavigate && onNavigate('login'); }}
                      className="w-full py-2.5 px-4 rounded-xl text-xs font-bold text-[#2F6FED] bg-blue-50 hover:bg-blue-100 transition-colors flex items-center justify-between"
                    >
                      <span>Se connecter à mon compte élève</span>
                      <span>→</span>
                    </button>
                    <button
                      onClick={() => { setMobileMenuOpen(false); onNavigate && onNavigate('signup'); }}
                      className="w-full py-2.5 px-4 rounded-xl text-xs font-bold text-white bg-gradient-to-r from-[#2F6FED] to-[#1E4FD1] shadow-sm flex items-center justify-center gap-1.5"
                    >
                      <span>Créer un compte élève</span>
                      <span>✨</span>
                    </button>
                  </div>

                </div>
              </div>
            )}

          </div>
        </header>
      );
    }

    // 2. COMPOSANT HERO AVEC L'IMAGE 3 EN FOND SUBTIL
    function Hero() {
      const scrollToDashboard = () => {
        const el = document.getElementById('dashboard-section');
        if (el) el.scrollIntoView({ behavior: 'smooth' });
      };

      const scrollToPricing = () => {
        const el = document.getElementById('pricing-section');
        if (el) el.scrollIntoView({ behavior: 'smooth' });
      };

      return (
        <section className="relative overflow-hidden pt-12 pb-16 lg:pt-20 lg:pb-24 bg-[#F7F8FA]">
          
          {/* FOND SUBTIL AVEC L'IMAGE 3 (Drapé Satin Congo) en filigrane doux */}
          <div
            className="absolute inset-0 pointer-events-none opacity-15 mix-blend-multiply bg-cover bg-center transition-opacity duration-700"
            style={{ backgroundImage: "url('assets/images/congo-bg.jpg')" }}
          ></div>

          {/* Dégradé doux de superposition pour une lisibilité parfaite */}
          <div className="absolute inset-0 bg-gradient-to-b from-white/90 via-white/80 to-[#F7F8FA] pointer-events-none"></div>

          {/* Cercles diffus */}
          <div className="absolute top-0 left-1/2 -translate-x-1/2 w-full max-w-7xl h-96 pointer-events-none overflow-hidden">
            <div className="absolute -top-32 left-1/4 w-96 h-96 bg-blue-100/40 rounded-full blur-3xl"></div>
            <div className="absolute top-10 right-1/4 w-80 h-80 bg-emerald-100/30 rounded-full blur-3xl"></div>
          </div>

          <div className="relative max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div className="text-center max-w-3xl mx-auto">
              
              {/* Badge Annonce */}
              <div className="inline-flex items-center gap-2 px-4 py-1.5 rounded-full bg-white/90 border border-blue-200/80 shadow-xs mb-6 backdrop-blur-md animate-fadeInUp">
                <span className="flex h-2 w-2 relative">
                  <span className="animate-ping absolute inline-flex h-full w-full rounded-full bg-[#22C55E] opacity-75"></span>
                  <span className="relative inline-flex rounded-full h-2 w-2 bg-[#22C55E]"></span>
                </span>
                <span className="text-xs font-bold text-[#1E4FD1]">
                  🇨🇬 E-School 2.0 • Conforme aux programmes officiels & Baccalauréat
                </span>
              </div>

              {/* Titre Principal H1 */}
              <h1 className="text-3xl sm:text-5xl lg:text-6xl font-black text-[#1A1D29] tracking-tight leading-[1.15] sm:leading-[1.12] mb-6">
                L'Excellence Scolaire & la{' '}
                <span className="bg-gradient-to-r from-[#2F6FED] via-[#255ED4] to-[#1E4FD1] bg-clip-text text-transparent">
                  Réussite aux Examens
                </span>{' '}
                à Portée de Main
              </h1>

              {/* Sous-titre */}
              <p className="text-base sm:text-lg text-slate-600 leading-relaxed max-w-2xl mx-auto mb-8 font-normal">
                La plateforme SaaS éducative tout-en-un pour lycéens, collégiens et parents au Congo et en Afrique Centrale. Révisez avec plus de <strong className="text-[#1A1D29]">5 000 exercices corrigés</strong>, des simulations réelles du Bac et un suivi personnalisé en temps réel.
              </p>

              {/* Boutons d'Action (Dual CTA) */}
              <div className="flex flex-col sm:flex-row items-center justify-center gap-4 mb-6">
                <button
                  onClick={scrollToPricing}
                  className="w-full sm:w-auto inline-flex items-center justify-center gap-2.5 px-7 py-3.5 rounded-2xl bg-gradient-to-r from-[#2F6FED] to-[#1E4FD1] text-white font-bold text-sm sm:text-base shadow-lg shadow-blue-500/25 btn-hover group"
                >
                  <span>Commencer l'essai gratuit (0 FCFA)</span>
                  <svg className="w-5 h-5 group-hover:translate-x-1 transition-transform" fill="none" viewBox="0 0 24 24" stroke="currentColor" strokeWidth="2.3">
                    <path strokeLinecap="round" strokeLinejoin="round" d="M14 5l7 7m0 0l-7 7m7-7H3" />
                  </svg>
                </button>

                <button
                  onClick={scrollToDashboard}
                  className="w-full sm:w-auto inline-flex items-center justify-center gap-2 px-6 py-3.5 rounded-2xl bg-white text-slate-700 font-bold text-sm sm:text-base border border-slate-200 shadow-sm hover:border-blue-200 hover:bg-slate-50/80 btn-hover group"
                >
                  <svg className="w-5 h-5 text-[#2F6FED] group-hover:translate-y-0.5 transition-transform" fill="none" viewBox="0 0 24 24" stroke="currentColor" strokeWidth="2">
                    <path strokeLinecap="round" strokeLinejoin="round" d="M19 14l-7 7m0 0l-7-7m7 7V3" />
                  </svg>
                  <span>Explorer le Dashboard interactif</span>
                </button>
              </div>

              {/* Réassurance */}
              <div className="flex flex-wrap items-center justify-center gap-y-2 gap-x-6 text-xs text-slate-500 mb-12">
                <div className="flex items-center gap-1.5">
                  <span className="text-[#22C55E] font-bold">✓</span>
                  <span>Sans carte bancaire requise</span>
                </div>
                <div className="flex items-center gap-1.5">
                  <span className="text-[#22C55E] font-bold">✓</span>
                  <span>Conforme aux programmes nationaux</span>
                </div>
                <div className="flex items-center gap-1.5">
                  <span className="text-[#22C55E] font-bold">✓</span>
                  <span>Formule dès <strong className="text-[#1A1D29]">15 000 FCFA/mois</strong></span>
                </div>
              </div>

              {/* Preuves Sociales */}
              <div className="grid grid-cols-1 sm:grid-cols-3 gap-4 text-left max-w-3xl mx-auto">

                  <div className="w-12 h-12 rounded-xl bg-blue-50 text-[#2F6FED] flex items-center justify-center font-black text-xl shrink-0">🎓</div>

                </div>

                <div className="p-5 rounded-2xl bg-white/95 border border-slate-100 shadow-sm shadow-slate-200/50 card-hover flex items-center gap-4 backdrop-blur-xs">
                  <div className="w-12 h-12 rounded-xl bg-[#E8F8EE] text-[#22C55E] flex items-center justify-center font-black text-xl shrink-0">📈</div>
                  <div>
                    <div className="text-2xl font-extrabold text-[#1A1D29] tracking-tight">94.8%</div>

                </div>

                <div className="p-5 rounded-2xl bg-white/95 border border-slate-100 shadow-sm shadow-slate-200/50 card-hover flex items-center gap-4 backdrop-blur-xs">

                  <div>
                    <div className="text-2xl font-extrabold text-[#1A1D29] tracking-tight">4.9 / 5</div>

                  </div>
                </div>
              </div>

            </div>

            <div className="mt-16 text-center">
              <div className="inline-flex items-center gap-2 px-3 py-1 rounded-lg bg-white/90 border border-slate-200/70 text-slate-600 text-xs font-bold uppercase tracking-wider mb-3 shadow-xs">
                <span className="w-2 h-2 rounded-full bg-[#22C55E] animate-pulse"></span>
                Démonstration Produit en Direct
              </div>
              <h2 className="text-xl sm:text-2xl font-black text-[#1A1D29] tracking-tight">

              <p className="text-xs sm:text-sm text-slate-500 max-w-xl mx-auto mt-1">

              </p>
            </div>

          </div>
        </section>
      );

    // 3. COMPOSANT DASHBOARD HEADER
    function DashboardHeader() {
      const [selectedPeriod, setSelectedPeriod] = useState('trimestre1');

      return (
        <div className="flex flex-col md:flex-row md:items-center md:justify-between gap-4 pb-6 pt-2">
          <div>
            <div className="flex items-center gap-2 mb-1">
              <h1 className="text-2xl sm:text-3xl font-extrabold text-[#1A1D29] tracking-tight">
                Aperçu du Tableau de bord
              </h1>
              <span className="inline-flex items-center px-2.5 py-0.5 rounded-full text-xs font-semibold bg-blue-50 text-[#2F6FED] border border-blue-100">
                Session Active
              </span>
            </div>

                            if (el) el.scrollIntoView({ behavior: 'smooth' });
                          }
                        }}
                        className="px-5 py-2.5 rounded-xl bg-gradient-to-r from-[#2F6FED] to-[#1E4FD1] text-white text-xs sm:text-sm font-bold shadow-md shadow-blue-500/20 btn-hover cursor-pointer"
                      >
                        {auth.isAuthenticated ? 'Mon Espace Pro' : 'Gérer mon abonnement'}
                      </button>
                    </div>
                  </div>
                </main>
              </section>

              {/* 3. Section Fonctionnalités Clés */}
              <Features />

              {/* 4. Section Tarifs en FCFA */}
              <Pricing />

              {/* 5. Section Témoignages & Bacheliers */}
              <Testimonials />

              {/* 6. Section FAQ Interactive */}
              <FAQ />

              {/* 7. Footer Complet & CTA de Clôture */}
              <Footer />
            </>
          )}

        </div>
      );
    }

    // Montage
    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
